description: Bad Request - Validation error
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - errors
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: "Validation error"
        errors:
          type: array
          items:
            type: string
          example:
            - "Name is required"
            - "Invalid email format"
