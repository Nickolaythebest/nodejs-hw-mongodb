description: Bad Request — The request was invalid or cannot be otherwise served
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: "Bad Request"
        errors:
          type: array
          description: Optional list of specific error messages
          items:
            type: string
          example:
            - "Invalid ID format"
            - "Missing required query parameter"
