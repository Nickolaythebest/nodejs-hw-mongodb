tags:
  - Login
summary: Login in account
operationId: postLogin
description: Login in account
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: "User's email"
            type: string
            example: mykola@example.com
          password:
            description: "User's password"
            type: string
            example: 12345qw
          
responses:
  '200':
    description: Successfully logged in an user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: "Successfully logged in an user!"
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  description: "The access token for the logged-in user"
                  example: "your_generated_access_token_here"

  '401':
    $ref: '../../../components/responses/401.yaml'

  '404':
    $ref: '../../../components/responses/404.yaml'

  '500':
    $ref: '../../../components/responses/500.yaml'
