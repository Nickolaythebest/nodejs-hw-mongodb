tags:
  - Contact
summary: Update contact
operationId: patchContact
description: Update an existing contact by ID
security:
  - bearerAuth: []

parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 67eb0c6b3ef6ff2768d3bb80

requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Name of contact"
            type: string
            example: Mykola

          phoneNumber:
            description: "Phone number of contact"
            type: string
            example: 380123456789
          
          email:
            description: Email of contact
            type: string
            example: mykola@example.com
          
          isFavourite:
            description: Is this your favourite contact?
            type: boolean
            example: false

          contactType:
            description: "Type of contact"
            type: string
            enum: ['work', 'home', 'personal']
            example: personal

          photo:
            description: Contact's avatar
            type: string
            format: binary

responses:
  '200':
    description: Successfully updated the contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: "Successfully updated the contact!"
            data:
              $ref: '../../../components/schemas/contact.yaml'

  '401':
    $ref: '../../../components/responses/401.yaml'

  '404':
    $ref: '../../../components/responses/404.yaml'

  '500':
    $ref: '../../../components/responses/500.yaml'