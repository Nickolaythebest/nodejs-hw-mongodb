tags:
  - Users
summary: Create contact
operationId: postContact
description: Create a new contact
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType

        properties:
          name:
            description: "Name of contact"
            type: string
            example: Mykola

          phoneNumber:       # Исправил опечатку
            description: "Phone number of contact"
            type: string
            example: 380123456789
          
          email:
            description: email of contact
            type: string
            example: mykola@example.com
          
          isFavourite:
            description: What is your favourite contact?
            type: boolean
            example: false

          contactType:
            description: "Type of contact"
            type: string
            enum: ['work', 'home', 'personal']
            example: personal

          photo:
            description: Contact's avatar
            type: string
            format: binary

responses:
  '201':
    description: Successfully created a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: "Successfully created a new contact!"
            data:
              $ref: '../../components/schemas/contact.yaml'

  '401':
    $ref: '../../components/responses/401.yaml'

  '404':
    $ref: '../../components/responses/404.yaml'

  '500':
    $ref: '../../components/responses/500.yaml'
