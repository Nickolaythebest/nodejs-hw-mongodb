tags:
  - Auth
summary: Get all contacts
operationId: getContacts
description: Get all contacts with optional search filters and sorting
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    description: Page number for pagination (default is 1)
    required: false
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: perPage
    in: query
    description: Number of items per page (default is 10, maximum is 100)
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 10
  - name: sortOrder
    in: query
    description: Sort order. Use 'asc' for ascending and 'desc' for descending (default is 'asc').
    required: false
    schema:
      type: string
      enum: [asc, desc]
      default: "asc"
responses:
  '200':
    description: Get all contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: "Successfully found contacts!"
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  description: List of contacts
                  type: array
                  items:
                    type: object
                    required:
                      - _id
                      - name
                      - phoneNumber
                      - contactType
                      - userId
                      - createdAt
                      - updatedAt
                    properties:
                      _id:
                        type: string
                        example: "67eb0c6b3ef6ff2768d3bb80"
                      name:
                        type: string
                        example: "Mykola"
                      phoneNumber:
                        type: string
                        example: "380123456789"
                      contactType:
                        type: string
                        enum: [work, home, personal]
                        example: "personal"
                      userId:
                        type: string
                        example: "67e279daa81c9e96874e80f3"
                      createdAt:
                        type: string
                        format: date-time
                        example: "2025-03-31T21:43:07.507Z"
                      updatedAt:
                        type: string
                        format: date-time
                        example: "2025-04-05T20:48:47.386Z"
                page:
                  type: integer
                  description: Current page
                  example: 1
                perPage:
                  type: integer
                  description: Limit of pages
                  example: 10
                totalItems:
                  type: integer
                  description: Total contacts
                  example: 12
                totalPages:
                  type: integer
                  description: Total pages
                  example: 2
                hasNextPage:
                  type: boolean
                  description: Has your list of contacts next page?
                  example: true
                hasPreviousPage:
                  type: boolean
                  description: Has your list of contacts previous page?
                  example: false

  '500':
    $ref: '../../components/responses/500.yaml'
